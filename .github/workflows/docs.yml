# Enable GitHub Pages in repo settings: Settings > Pages > Source > GitHub Actions.
# The workflow will fail silently if Pages is not enabled.
name: Deploy Docs

on:
  push:
    branches: [master]
    paths: [docs/**, README.md]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: peteretelej/starlight-action@3127bd1a5b8843946c27d0e9c0e5f6219cc295d4 # v1
        with:
          docs: docs/
          title: NASA Go SDK
          description: "The comprehensive Go SDK for NASA APIs"
          readme: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
